# Publica o Projeto Raízes no GitHub Pages.
# Roda a cada push na master, ou seja, a cada release ou hotfix do GitFlow.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o que estiver na fila
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: desenvolvimento-web/projeto-raizes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desenvolvimento-web/projeto-raizes/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: desenvolvimento-web/projeto-raizes/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
